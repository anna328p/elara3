triage_model = "claude-sonnet-5"
sweep_model = "claude-sonnet-5"
subagent_model = "claude-sonnet-5"

# Writes the one-liners that represent deferred events back to triage.
digest_model = "claude-haiku-4-5"

db_path = "events.db"

# Effort: low | medium | high | max. Nobody waits on the sweep and its calls are
# the irreversible ones, so it gets more than the work it hands out.
subagent_effort = "medium"
sweep_effort = "high"

# A subagent's tool loop: this many model calls per assignment at most, the
# memory tool's reads and edits included, before it is stopped.
subagent_max_iterations = 8

# Each role's pass runs this often, timed from its last pass. A check-in or an
# override brings a pass forward, as a nudge or an active arrival does for
# triage, and the rhythm restarts from it. Last in the file: every key after a
# table header belongs to it.
[heartbeat_seconds]
triage = 300
sweep = 3600
