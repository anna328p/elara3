[project]
name = "event-prototype"
version = "0.1.0"
description = "Prototype of the elara3 event queue: async queue, LLM triage, subagent dispatch"
requires-python = ">=3.12"
dependencies = [
    "anthropic[mcp]>=0.75",
    "mcp>=1.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_prototype"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
